    <meta name="description" content="Zellavora is a remote-first IT services & consulting startup from Chennai. Cloud, cybersecurity, custom software, and AI solutions delivered by senior engineers." />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

      href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"

    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />

  <body>
    <app-root>
      <div class="app-boot">
        <div class="app-boot__spinner"></div>
      </div>
    </app-root>
    <style>
      .app-boot {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0F172A;
      }
      .app-boot__spinner {
        width: 38px;
        height: 38px;
        border-radius: 50%;
        border: 3px solid rgba(255, 255, 255, 0.12);
        border-top-color: #A855F7;
        animation: appBootSpin 0.9s cubic-bezier(0.65, 0, 0.35, 1) infinite;
      }
      @keyframes appBootSpin {
        to { transform: rotate(360deg); }
      }
    </style>
  </body>
